services:

  monitor-mcp:
    build: .
    container_name: litellm-monitor-mcp
    restart: unless-stopped

    # Lebt, wenn der MCP auf HTTP antwortet (GET /mcp liefert 406 - jede HTTP-Antwort reicht)
    healthcheck:
      test: ["CMD", "python", "-c", 'import socket,sys; s=socket.create_connection(("127.0.0.1",8000),5); s.sendall(b"GET /mcp HTTP/1.0\r\n\r\n"); sys.exit(0 if s.recv(12).startswith(b"HTTP/") else 1)']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - docker-proxy

    environment:
      DOCKER_URL: http://docker-proxy:2375
      STATUS_FILE: /host-status/status.json
      IMAGE_CACHE_HOURS: ${IMAGE_CACHE_HOURS:-6}
      # Kommagetrennt, ohne Tag = alle Tags dieses Images
      IMAGE_IGNORE: ${IMAGE_IGNORE:-}
      # Nur-Lese-Key (Rolle proxy_admin_viewer) für report(section="kosten")
      LITELLM_VIEWER_KEY: ${LITELLM_VIEWER_KEY:-}

    # Host-Daten vom server-status.timer (APT, systemd, Platten, Journal)
    volumes:
      - /var/lib/server-status:/host-status:ro

    # litellm_net: LiteLLM erreicht den MCP, der MCP erreicht die Registries (Image-Updates)
    # proxy_net: nur zum Docker-Socket-Proxy
    networks:
      - litellm_net
      - proxy_net

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m

  # Docker-API nur lesend: Container und Images (GET), kein POST, kein exec
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: litellm-monitor-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m


networks:

  litellm_net:
    external: true
    name: litellm-caveman_default

  proxy_net:
    internal: true
